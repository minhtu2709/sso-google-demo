<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 420px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input, button, a {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        a {
            display: block;
            text-align: center;
            text-decoration: none;
            background: #eeeeee;
            color: black;
            border: 1px solid #cccccc;
        }

        #status {
            margin-top: 12px;
            color: red;
            white-space: pre-line;
        }
    </style>
</head>
<body>
<h1>Đăng ký</h1>

<form id="register-form">
    <input id="name" type="text" placeholder="Họ tên" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Mật khẩu" required>
    <button type="submit">Tạo tài khoản</button>
</form>

<a href="/login.html">Đã có tài khoản? Đăng nhập</a>

<div id="status"></div>

<script>
    const form = document.getElementById("register-form");
    const statusEl = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        statusEl.textContent = "";

        const payload = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
        };

        try {
            const response = await fetch("/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                if (result.data && typeof result.data === "object") {
                    const errors = Object.values(result.data).join("\n");
                    throw new Error(errors || result.message || "Đăng ký thất bại");
                }

                throw new Error(result.message || "Đăng ký thất bại");
            }

            statusEl.style.color = "green";
            statusEl.textContent = "Đăng ký thành công. Đang chuyển sang trang đăng nhập...";

            setTimeout(() => {
                window.location.href = "/login.html";
            }, 1200);
        } catch (error) {
            statusEl.style.color = "red";
            statusEl.textContent = error.message;
        }
    });
</script>
</body>
</html>
