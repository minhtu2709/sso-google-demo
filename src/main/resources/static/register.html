<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Commercial App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="card auth-card">
        <h2 class="text-center mb-4">Tạo Tài Khoản</h2>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" placeholder="Nhập email hợp lệ" required>
            </div>
            
            <div class="form-group mb-3">
                <label class="form-label" for="password">Mật khẩu</label>
                <input class="form-control" id="password" type="password" placeholder="Tạo mật khẩu (ít nhất 6 ký tự)" required minlength="6">
            </div>

            <div class="form-group mb-4">
                <label class="form-label" for="confirmPassword">Xác nhận mật khẩu</label>
                <input class="form-control" id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu" required minlength="6">
            </div>

            <button class="btn btn-primary mb-3" type="submit">Đăng ký ngay</button>
        </form>

        <div class="text-center mt-2">
            <span class="text-muted">Đã có tài khoản?</span> <a href="/login.html">Đăng nhập</a>
        </div>

        <div id="status" class="status-message"></div>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("register-form");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            App.hideStatus("status");

            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password !== confirmPassword) {
                App.showStatus("status", "Mật khẩu xác nhận không khớp!", false);
                return;
            }

            const payload = {
                email: document.getElementById("email").value.trim(),
                password: password,
                confirmPassword: confirmPassword
            };

            try {
                const response = await fetch("/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    if (result.data && typeof result.data === "object") {
                        const errors = Object.values(result.data).join("\n");
                        throw new Error(errors || result.message || "Đăng ký thất bại");
                    }
                    throw new Error(result.message || "Đăng ký thất bại");
                }

                App.showStatus("status", "Đăng ký thành công! Đang chuyển sang trang đăng nhập...", true);

                setTimeout(() => {
                    window.location.href = "/login.html";
                }, 1500);
            } catch (error) {
                App.showStatus("status", error.message, false);
            }
        });
    });
</script>
</body>
</html>
