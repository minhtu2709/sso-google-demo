<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cổng thanh toán giả lập</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: #ffffff; margin: 0; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden;">
    <!-- Nền sáng tối giản phía sau -->
    <div style="position: absolute; inset: 0; background: #f8f9fa;"></div>

    <!-- Overlay nhẹ -->
    <div id="modal-overlay" style="position: fixed; inset: 0; background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; transition: opacity 0.4s ease;">
        
        <!-- Nội dung Popup (Card) -->
        <div id="payment-card" class="card" style="max-width: 450px; text-align: center; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); position: relative; transform: scale(0.7); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); background: white; border-radius: 20px; border: 1px solid #eee;">
            
            <!-- Nút Quay lại -->
            <a href="/user-dashboard.html" style="position: absolute; top: 20px; left: 20px; text-decoration: none; color: #888; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 5px; transition: color 0.2s;">
                ← Quay lại
            </a>

            <!-- Countdown Timer Badge -->
            <div id="timer-badge" style="position: absolute; top: 18px; right: 20px; background: #ff4d4f; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; box-shadow: 0 4px 10px rgba(255, 77, 79, 0.3);">
                ⏳ <span id="countdown">15:00</span>
            </div>

            <div id="loading-step" style="padding: 40px 0;">
                <div class="spinner-custom" style="width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-color); border-radius: 50%; animation: spin-custom 1s linear infinite; margin: 0 auto 20px;"></div>
                <p style="color: #666; font-weight: 500;">Đang khởi tạo mã thanh toán an toàn...</p>
            </div>

            <div id="qr-step" style="display: none; animation: fadeInCustom 0.5s ease;">
                <h2 id="title" class="mb-2" style="font-size: 1.5rem; color: #333;">Đang kết nối...</h2>
                <p id="info" class="text-muted mb-4" style="font-size: 14px;"></p>

                <!-- MoMo App Button (Chỉ hiện khi là MOMO) -->
                <div id="momo-cta" style="display: none; margin-bottom: 20px;">
                    <button onclick="openMomoApp()" class="btn" style="background: #a50064; color: white; font-weight: bold; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(165, 0, 100, 0.3);">
                        🚀 MỞ VÍ MOMO ĐỂ THANH TOÁN
                    </button>
                    <p style="font-size: 12px; color: #888; margin-top: 10px;">(Tự động điền số tiền & thông tin)</p>
                </div>

                <div id="qr-container" style="margin: 20px auto; padding: 20px; background: #fcfcfc; border-radius: 16px; width: 300px; border: 1px solid #eee; box-shadow: inset 0 2px 10px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; justify-content: center;">
                    <div style="width: 260px; height: 260px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: white; border-radius: 10px; border: 1px solid #f0f0f0;">
                        <img id="qr-code" src="" alt="QR Code"
                             style="max-width: 100%; max-height: 100%; object-fit: contain; display: block; margin: 0 auto;">
                    </div>
                    <p class="mt-3" style="font-size: 13px; color: #555; font-weight: 600; line-height: 1.5; margin-bottom: 0;" id="qr-instruction"></p>
                </div>

                <div id="status-polling" class="mt-4 text-primary" style="font-size: 14px; font-weight: 600; display: block;">
                    <span class="spinner-custom" style="display: inline-block; width: 12px; height: 12px; border: 2px solid #e0e0e0; border-top: 2px solid var(--primary-color); border-radius: 50%; animation: spin-custom 1s linear infinite;"></span> Hệ thống đang chờ thanh toán...
                </div>

                <!-- Simulation Section -->
                <div style="margin-top: 30px; padding: 12px; border: 1px dashed #ddd; border-radius: 12px; background: #fafafa;">
                    <div style="display: flex; flex-direction: column; gap: 8px; align-items: center;">
                        <button onclick="process(true)" class="btn btn-sm btn-outline" style="font-size: 11px; width: auto; padding: 6px 12px; border-radius: 8px; color: #52c41a; border-color: #b7eb8f;">
                            🔔 Giả lập thanh toán thành công
                        </button>
                        <button onclick="simulateExpire()" class="btn btn-sm btn-outline" style="font-size: 11px; width: auto; padding: 6px 12px; border-radius: 8px; color: #fa8c16; border-color: #ffd591;">
                            ⏳ Giả lập hết hạn thanh toán
                        </button>
                    </div>
                    <p style="font-size: 9px; color: #ccc; margin-top: 8px;">System Version: 2.4 - Expire Simulation</p>
                </div>
            </div>

            <div id="expired-msg" style="display: none; color: #ff4d4f; font-weight: bold; margin-top: 20px; font-size: 1.1rem;">
                🚫 Giao dịch đã hết hạn
            </div>
        </div>
    </div>

    <style>
        @keyframes spin-custom { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeInCustom { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-custom { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>

    <script>
        window.onload = () => {
            // Hiệu ứng hiện Popup
            setTimeout(() => {
                document.getElementById('modal-overlay').style.opacity = '1';
                document.getElementById('payment-card').style.transform = 'scale(1)';
            }, 100);

            // Chuyển từ Loading sang QR sau 1.8s
            setTimeout(() => {
                const loadingStep = document.getElementById('loading-step');
                if (loadingStep) loadingStep.style.display = 'none';
                const qrStep = document.getElementById('qr-step');
                if (qrStep) qrStep.style.display = 'block';
            }, 1800);
        };

        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('orderId');
        const method = params.get('method');
        const createdAt = params.get('createdAt'); 
        let orderAmount = 0;

        document.getElementById('title').innerText = "Thanh toán " + (method || "Online");
        document.getElementById('info').innerText = "Mã đơn hàng: #" + orderId;

        const BANK_ID = "MB";
        const ACCOUNT_NO = "0388739153";
        const PHONE_NUMBER = "0388739153"; 

        async function fetchOrderInfo() {
            try {
                const token = localStorage.getItem('token');
                const res = await fetch(`/orders/${orderId}`, {
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                });
                const result = await res.json();
                if (result.success) {
                    orderAmount = result.data.totalPrice;
                    generateQR();
                }
            } catch (e) { console.error("Error fetching order", e); }
        }
        function generateQR() {
            const qrImg = document.getElementById('qr-code');
            const qrInstruction = document.getElementById('qr-instruction');
            const description = `DH${orderId}`;

            if (method === 'MOMO') {
                const momoLink = `https://nhantien.momo.vn/0388739153/${orderAmount}`;
                
                // Hiện nút bấm cho Mobile
                document.getElementById('momo-cta').style.display = 'block';

                // QR Đơn giản (Chỉ chứa link, không mã hóa quá nhiều)
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(momoLink)}`;
                qrInstruction.innerHTML = `Hoặc quét mã để trả <strong>${orderAmount.toLocaleString()}đ</strong>`;
                
                // Lưu link để dùng cho nút bấm
                window.currentMomoLink = momoLink;
            } else {
                document.getElementById('momo-cta').style.display = 'none';
                const bankUrl = `https://img.vietqr.io/image/MB-0388739153-compact2.png?amount=${orderAmount}&addInfo=${description}&accountName=CHỦ CỬA HÀNG`;
                qrImg.src = bankUrl;
                qrInstruction.innerHTML = `Quét mã để trả <strong>${orderAmount.toLocaleString()}đ</strong> qua MBBank`;
            }
        }

        window.openMomoApp = () => {
            if (window.currentMomoLink) {
                window.location.href = window.currentMomoLink;
            }
        };

        fetchOrderInfo();

        const TOTAL_TIME = 15 * 60;
        let timeLeft = TOTAL_TIME;

        if (createdAt) {
            const startTime = parseInt(createdAt);
            const now = Date.now();
            const elapsedSeconds = Math.floor((now - startTime) / 1000);
            timeLeft = TOTAL_TIME - elapsedSeconds;
        }

        const countdownEl = document.getElementById('countdown');
        const timerBadge = document.getElementById('timer-badge');

        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.innerText = "00:00";
                handleExpired();
                return;
            }

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownEl.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft < 60) {
                timerBadge.style.animation = "pulse-custom 1s infinite";
            }
            timeLeft--;
        }, 1000);

        function handleExpired() {
            const polling = document.getElementById('status-polling');
            if (polling) polling.style.display = 'none';
            const qrStep = document.getElementById('qr-step');
            if (qrStep) qrStep.style.opacity = '0.5';
            const expiredMsg = document.getElementById('expired-msg');
            if (expiredMsg) expiredMsg.style.display = 'block';
            document.getElementById('timer-badge').style.background = "#999";
        }

        startPolling();

        function process(success) {
            if (timeLeft <= 0) return;
            window.location.href = `/api/payment/callback?orderId=${orderId}&success=${success}`;
        }

        window.simulateExpire = () => {
            if (timeLeft <= 0) return;
            window.location.href = `/api/payment/simulate-expire?orderId=${orderId}`;
        };

        async function startPolling() {
            const token = localStorage.getItem('token');
            const pollInterval = setInterval(async () => {
                if (timeLeft <= 0) { clearInterval(pollInterval); return; }
                try {
                    const res = await fetch(`/orders/${orderId}`, {
                        headers: token ? { 'Authorization': 'Bearer ' + token } : {}
                    });
                    const result = await res.json();
                    if (result.success && result.data.paymentStatus === 'PAID') {
                        clearInterval(pollInterval);
                        alert("✅ Hệ thống đã nhận được tiền!\nĐang quay lại trang chủ...");
                        window.location.href = '/user-dashboard.html';
                    }
                    if (result.success && result.data.status === 'CANCELLED') {
                        clearInterval(pollInterval);
                        alert("🚫 Đơn hàng đã bị hủy hoặc hết hạn.");
                        window.location.href = '/user-dashboard.html';
                    }
                } catch (e) {
                    console.error("Polling error", e);
                }
            }, 3000);
        }
    </script>
</body>
</html>
