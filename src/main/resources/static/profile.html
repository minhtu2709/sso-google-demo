<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Commercial App</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .avatar-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }
        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="navbar-brand">Commercial App - Hồ Sơ</div>
        <div class="navbar-nav">
            <button id="btn-back" class="btn btn-outline btn-sm">Quay lại</button>
            <button class="btn btn-outline btn-sm logout-btn">Đăng xuất</button>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 800px; margin-top: 20px;">
    <div id="status" class="status-message mb-3">Đang tải...</div>

    <div class="card">
        <div class="profile-header">
            <img id="avatar-display" src="https://via.placeholder.com/80" alt="Avatar" class="avatar-img">
            <div>
                <h3 style="margin: 0;" id="display-name">Đang tải...</h3>
                <span class="badge badge-primary mt-2" id="display-role">USER</span>
            </div>
            <div style="margin-left: auto;" id="password-action-container">
                <a href="/change-password.html" class="btn btn-outline btn-sm">Đổi mật khẩu</a>
            </div>
        </div>

        <h4 class="mb-3">Cập nhật thông tin cá nhân</h4>
        <form id="profile-form">
            <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input type="text" id="edit-name" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email (Không thể sửa)</label>
                <input type="email" id="edit-email" class="form-control" disabled style="background-color: var(--secondary-color);">
            </div>
            <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input type="tel" id="edit-phone" class="form-control" required pattern="^[0-9]{10}$" title="Vui lòng nhập đúng 10 chữ số">
            </div>
            
            <div class="form-group">
                <label class="form-label">Địa chỉ hiện tại</label>
                <input type="text" id="edit-address" class="form-control" required placeholder="Nhập địa chỉ giao hàng">
            </div>

            <div class="form-group" style="background: var(--bg-color); padding: 15px; border-radius: var(--border-radius-sm);">
                <label class="form-label text-primary" style="font-size: 0.9rem; cursor: pointer;" id="toggle-vn-address">
                    <input type="checkbox" id="use-vn-picker"> Chọn địa chỉ theo Tỉnh/Thành VN
                </label>
                <div id="vn-address-picker" style="display: none; margin-top: 10px;">
                    <div class="form-row">
                        <div class="form-group">
                            <select id="prov-select" class="form-control">
                                <option value="">Chọn Tỉnh/Thành</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select id="dist-select" class="form-control" disabled>
                                <option value="">Chọn Quận/Huyện</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <select id="ward-select" class="form-control" disabled>
                                <option value="">Chọn Phường/Xã</option>
                            </select>
                        </div>
                    </div>
                    <input type="text" id="street-input" class="form-control mt-2" placeholder="Số nhà, tên đường...">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">Lưu thông tin</button>
        </form>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        let currentUser = null;

        async function initProfile() {
            const token = App.getToken();
            if (!token) return window.location.href = "/login.html";

            try {
                currentUser = await App.callApi("/auth/me");
                document.getElementById("status").style.display = 'none';

                // Fill data
                document.getElementById("display-name").textContent = currentUser.name || "Người dùng";
                document.getElementById("display-role").textContent = currentUser.role;
                if (currentUser.role === 'ADMIN') document.getElementById("display-role").className = "badge badge-danger mt-2";
                if (currentUser.avatarUrl) document.getElementById("avatar-display").src = currentUser.avatarUrl;

                document.getElementById("edit-name").value = currentUser.name || "";
                document.getElementById("edit-email").value = currentUser.email || "";
                document.getElementById("edit-phone").value = currentUser.phoneNumber || "";
                document.getElementById("edit-address").value = currentUser.address || "";

                // Hide password section if using social login
                if (currentUser.provider !== "LOCAL") {
                    document.getElementById("password-action-container").style.display = "none";
                }

                // Setup back button
                document.getElementById("btn-back").addEventListener("click", () => {
                    if (currentUser.role === "ADMIN") {
                        window.location.href = "/admin-dashboard.html";
                    } else {
                        window.location.href = "/user-dashboard.html";
                    }
                });

            } catch (error) {
                App.showStatus("status", error.message, false);
                if (error.message.includes("Token")) setTimeout(() => App.logout(), 2000);
            }
        }

        // ================= ADDRESS PICKER LOGIC =================
        const provSelect = document.getElementById("prov-select");
        const distSelect = document.getElementById("dist-select");
        const wardSelect = document.getElementById("ward-select");
        const streetInput = document.getElementById("street-input");
        const addressInput = document.getElementById("edit-address");

        document.getElementById("use-vn-picker").addEventListener("change", async (e) => {
            const picker = document.getElementById("vn-address-picker");
            if (e.target.checked) {
                picker.style.display = "block";
                addressInput.readOnly = true;
                addressInput.style.backgroundColor = "var(--secondary-color)";
                
                if (provSelect.options.length === 1) { // Load provinces first time
                    const provs = await App.LocationAPI.getProvinces();
                    provSelect.innerHTML += provs.map(p => `<option value="${p.code}" data-name="${p.name}">${p.name}</option>`).join('');
                }
            } else {
                picker.style.display = "none";
                addressInput.readOnly = false;
                addressInput.style.backgroundColor = "var(--white)";
            }
        });

        provSelect.addEventListener("change", async (e) => {
            const code = e.target.value;
            distSelect.innerHTML = '<option value="">Chọn Quận/Huyện</option>';
            wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';
            wardSelect.disabled = true;
            if (!code) {
                distSelect.disabled = true;
                updateAddressField();
                return;
            }
            distSelect.disabled = false;
            const dists = await App.LocationAPI.getDistricts(code);
            distSelect.innerHTML += dists.map(d => `<option value="${d.code}" data-name="${d.name}">${d.name}</option>`).join('');
            updateAddressField();
        });

        distSelect.addEventListener("change", async (e) => {
            const code = e.target.value;
            wardSelect.innerHTML = '<option value="">Chọn Phường/Xã</option>';
            if (!code) {
                wardSelect.disabled = true;
                updateAddressField();
                return;
            }
            wardSelect.disabled = false;
            const wards = await App.LocationAPI.getWards(code);
            wardSelect.innerHTML += wards.map(w => `<option value="${w.code}" data-name="${w.name}">${w.name}</option>`).join('');
            updateAddressField();
        });

        wardSelect.addEventListener("change", updateAddressField);
        streetInput.addEventListener("input", updateAddressField);

        function updateAddressField() {
            if (!document.getElementById("use-vn-picker").checked) return;
            const p = provSelect.options[provSelect.selectedIndex]?.getAttribute("data-name") || "";
            const d = distSelect.options[distSelect.selectedIndex]?.getAttribute("data-name") || "";
            const w = wardSelect.options[wardSelect.selectedIndex]?.getAttribute("data-name") || "";
            const s = streetInput.value.trim();

            let parts = [];
            if(s) parts.push(s);
            if(w) parts.push(w);
            if(d) parts.push(d);
            if(p) parts.push(p);

            addressInput.value = parts.join(", ");
        }

        // ================= FORM SUBMITS =================
        document.getElementById("profile-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;

            const payload = {
                name: document.getElementById("edit-name").value.trim(),
                phoneNumber: document.getElementById("edit-phone").value.trim(),
                address: document.getElementById("edit-address").value.trim()
            };

            try {
                currentUser = await App.callApi("/auth/me", {
                    method: "PUT",
                    body: JSON.stringify(payload)
                });
                
                alert("Cập nhật thông tin thành công!");
                document.getElementById("display-name").textContent = currentUser.name;
                btn.disabled = false;
            } catch (error) { 
                alert(error.message);
                btn.disabled = false;
            }
        });

        initProfile();
    });
</script>
</body>
</html>
