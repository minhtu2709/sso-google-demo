<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu - Commercial App</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="navbar-brand">Commercial App - Đổi mật khẩu</div>
        <div class="navbar-nav">
            <button id="btn-back" class="btn btn-outline btn-sm">Quay lại</button>
            <button class="btn btn-outline btn-sm logout-btn">Đăng xuất</button>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 600px; margin-top: 50px;">
    <div class="card">
        <h4 class="mb-3">Đổi mật khẩu</h4>
        <div id="pwd-status" class="status-message"></div>
        <form id="password-form">
            <div class="form-group">
                <label class="form-label">Mật khẩu hiện tại</label>
                <input type="password" id="old-pwd" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" id="new-pwd" class="form-control" required minlength="6">
            </div>
            <div class="form-group mb-4">
                <label class="form-label">Xác nhận mật khẩu mới</label>
                <input type="password" id="confirm-pwd" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-danger" style="width: 100%;">Cập nhật mật khẩu</button>
        </form>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const token = App.getToken();
        if (!token) return window.location.href = "/login.html";

        let currentUser = null;
        try {
            currentUser = await App.callApi("/auth/me");
            if (currentUser.provider !== "LOCAL") {
                alert("Tài khoản đăng nhập qua MXH không thể đổi mật khẩu tại đây.");
                window.location.href = "/profile.html";
                return;
            }
        } catch (error) {
            if (error.message.includes("Token")) {
                App.logout();
            }
        }

        document.getElementById("btn-back").addEventListener("click", () => {
            if (currentUser && currentUser.role === "ADMIN") {
                window.location.href = "/admin-dashboard.html";
            } else {
                window.location.href = "/profile.html";
            }
        });

        document.getElementById("password-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            App.hideStatus("pwd-status");
            const btn = e.target.querySelector('button[type="submit"]');
            
            const oldPwd = document.getElementById("old-pwd").value;
            const newPwd = document.getElementById("new-pwd").value;
            const confirmPwd = document.getElementById("confirm-pwd").value;

            if (newPwd !== confirmPwd) {
                App.showStatus("pwd-status", "Xác nhận mật khẩu mới không khớp!", false);
                return;
            }

            btn.disabled = true;
            try {
                await App.callApi("/auth/me/password", {
                    method: "PUT",
                    body: JSON.stringify({
                        oldPassword: oldPwd,
                        newPassword: newPwd,
                        confirmPassword: confirmPwd
                    })
                });
                
                App.showStatus("pwd-status", "Đổi mật khẩu thành công!", true);
                e.target.reset();
                btn.disabled = false;
            } catch (error) { 
                App.showStatus("pwd-status", error.message, false);
                btn.disabled = false;
            }
        });
    });
</script>
</body>
</html>
