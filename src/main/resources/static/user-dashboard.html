<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng - Commercial App</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .hidden { display: none !important; }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .product-card {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 15px;
            text-align: center;
            background: var(--white);
        }
        .product-card img {
            max-width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: var(--border-radius-sm);
            margin-bottom: 10px;
            background-color: var(--bg-color);
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-total {
            font-weight: bold;
            font-size: 1.2rem;
            margin-top: 15px;
            text-align: right;
            color: var(--danger-color);
        }
        .order-card {
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: var(--border-radius-sm);
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <div class="navbar-brand">Commercial App</div>
        <div class="navbar-nav">
            <span id="user-name" class="text-muted" style="margin-right: 15px; font-weight: 500;"></span>
            <a href="/profile.html" class="btn btn-primary btn-sm">Cập nhật thông tin</a>
            <button class="btn btn-outline btn-sm logout-btn">Đăng xuất</button>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 1400px; margin-top: 20px;">
    <div id="status" class="status-message mb-3" style="display: block;">Đang tải cửa hàng...</div>

    <div id="main-content" class="hidden">
        <div class="grid-cards" style="grid-template-columns: 2fr 1fr;">
            <!-- Store -->
            <div>
                <div class="card mb-4">
                    <h4 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Cửa Hàng</h4>
                    <div class="product-grid" id="product-list"></div>
                </div>
                <div class="card">
                    <h4 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Đơn hàng của tôi</h4>
                    <div id="order-list" style="margin-top: 15px;"></div>
                </div>
            </div>
            <!-- Cart -->
            <div>
                <div class="card mb-4" style="background-color: #fcfcfc;">
                    <h4 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Giỏ hàng</h4>
                    <div id="cart-items" style="margin-top: 15px;"></div>
                    <div class="cart-total" id="cart-total">Tổng: 0 đ</div>
                    <div style="margin-top: 20px;">
                        <input type="text" id="shipping-address" class="form-control mb-2" placeholder="Nhập địa chỉ giao hàng">
                        <button class="btn btn-success" id="btn-checkout" style="width: 100%;">Thanh toán / Đặt hàng</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Overlay: Enforce Profile Completion -->
<div class="overlay" id="enforce-profile-overlay">
    <div class="card" style="max-width: 450px;">
        <h3 class="mb-2 text-danger text-center">Hoàn tất hồ sơ</h3>
        <p class="text-muted text-center mb-4">Bạn cần bổ sung thông tin cá nhân để có thể mua hàng.</p>
        <form id="enforce-profile-form">
            <div class="form-group">
                <label class="form-label">Họ và tên</label>
                <input type="text" id="enforce-name" class="form-control" required>
            </div>
            <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input type="tel" id="enforce-phone" class="form-control" required pattern="^[0-9]{10}$">
            </div>
            <div class="form-group mb-4">
                <label class="form-label">Địa chỉ</label>
                <input type="text" id="enforce-address" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success" style="width: 100%;">Lưu thông tin</button>
        </form>
    </div>
</div>

<script src="/js/app.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        App.saveTokenFromHash();
        let currentUser = null;

        async function initUser() {
            const token = App.getToken();
            if (!token) return window.location.href = "/login.html";

            try {
                currentUser = await App.callApi("/auth/me");
                if (currentUser.role === "ADMIN") return window.location.href = "/admin-dashboard.html";
                checkProfileCompletion();
            } catch (error) {
                App.showStatus("status", error.message, false);
                if (error.message.includes("Token")) setTimeout(() => App.logout(), 2000);
            }
        }

        function checkProfileCompletion() {
            const u = currentUser;
            const isProfileIncomplete = !u.name || !u.phoneNumber || !u.address;

            if (isProfileIncomplete) {
                document.getElementById("enforce-profile-overlay").classList.add("active");
                document.getElementById("main-content").classList.add("hidden");
            } else {
                document.getElementById("enforce-profile-overlay").classList.remove("active");
                setupDashboard();
            }
        }

        async function setupDashboard() {
            document.getElementById("user-name").textContent = "Xin chào, " + (currentUser.name || "Người dùng");
            
            // HIỆN DASHBOARD
            document.getElementById("status").style.display = "none";
            document.getElementById("main-content").classList.remove("hidden");
            
            if (currentUser.address) document.getElementById("shipping-address").value = currentUser.address;

            await loadProducts();
            await loadCart();
            await loadOrders();
        }

        async function loadProducts() {
            try {
                const res = await App.callApi("/products?size=50&status=ACTIVE");
                const items = res.items || [];

                const container = document.getElementById("product-list");
                if (!items || items.length === 0) {
                    container.innerHTML = "<p class='text-muted'>Chưa có sản phẩm nào.</p>";
                    return;
                }
                container.innerHTML = items.map(p => `
                    <div class="product-card">
                        <img src="${p.imageUrl || 'https://via.placeholder.com/150'}" alt="${p.name}">
                        <div style="font-weight: 600; min-height: 40px; display: flex; align-items: center; justify-content: center;">${p.name}</div>
                        <div class="text-danger" style="font-weight: bold;">${(p.price || 0).toLocaleString('vi-VN')} đ</div>
                        <button class="btn btn-outline btn-sm" onclick="addToCart(${p.id})">Thêm vào giỏ</button>
                    </div>
                `).join("");
            } catch (e) {
                console.error("Lỗi tải sản phẩm:", e);
                document.getElementById("product-list").innerHTML = "<p class='text-danger text-center'>Lỗi tải sản phẩm.</p>";
            }
        }

        async function loadCart() {
            try {
                const cart = await App.callApi("/cart");
                const container = document.getElementById("cart-items");
                const totalEl = document.getElementById("cart-total");

                if (!cart || !cart.items || cart.items.length === 0) {
                    container.innerHTML = "<p class='text-muted text-center'>Trống.</p>";
                    totalEl.textContent = "Tổng: 0 đ";
                    return;
                }
                container.innerHTML = cart.items.map(item => `
                    <div class="cart-item">
                        <div>
                            <div><strong>${item.productName || 'Sản phẩm'}</strong></div>
                            <div class="text-muted" style="font-size: 0.8rem;">${(item.price || 0).toLocaleString('vi-VN')} x ${item.quantity}</div>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="removeFromCart(${item.id})">&times;</button>
                    </div>
                `).join("");
                totalEl.textContent = `Tổng: ${(cart.totalPrice || 0).toLocaleString('vi-VN')} đ`;
            } catch (e) {
                console.error("Lỗi tải giỏ hàng:", e);
                document.getElementById("cart-items").innerHTML = "<p class='text-danger'>Không thể tải giỏ hàng.</p>";
            }
        }

        window.addToCart = async (id) => {
            try { await App.callApi("/cart/items", { method: "POST", body: JSON.stringify({ productId: id, quantity: 1 }) }); alert("Đã thêm!"); loadCart(); } catch (e) { alert(e.message); }
        };

        window.removeFromCart = async (id) => {
            try { await App.callApi(`/cart/items/${id}`, { method: "DELETE" }); loadCart(); } catch (e) { alert(e.message); }
        };

        document.getElementById("btn-checkout").addEventListener("click", async () => {
            const addr = document.getElementById("shipping-address").value.trim();
            if (!addr) return alert("Nhập địa chỉ!");
            try { await App.callApi("/orders", { method: "POST", body: JSON.stringify({ shippingAddress: addr }) }); alert("Thành công!"); loadCart(); loadOrders(); } catch (e) { alert(e.message); }
        });

        async function loadOrders() {
            try {
                const orders = await App.callApi("/orders");
                const container = document.getElementById("order-list");
                if (!orders || orders.length === 0) {
                    container.innerHTML = "<p class='text-muted'>Chưa có đơn hàng nào.</p>";
                    return;
                }
                container.innerHTML = orders.map(o => `
                    <div class="order-card">
                        <div class="flex-between">
                            <strong>Đơn hàng #${o.id}</strong> 
                            <span class="badge ${o.status === 'PENDING' ? 'badge-primary' : (o.status === 'CANCELLED' ? 'badge-danger' : 'badge-success')}">${o.status}</span>
                        </div>
                        <div class="text-danger" style="font-weight: bold; margin-top: 5px;">Tổng: ${(o.totalPrice || 0).toLocaleString('vi-VN')} đ</div>
                        <div class="text-muted" style="font-size: 0.85rem;">Địa chỉ: ${o.shippingAddress || '—'}</div>
                    </div>
                `).join("");
            } catch (e) {
                console.error("Lỗi tải đơn hàng:", e);
                document.getElementById("order-list").innerHTML = "<p class='text-danger text-center'>Lỗi tải đơn hàng.</p>";
            }
        }

        document.getElementById("enforce-profile-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            try {
                currentUser = await App.callApi("/auth/profile", { method: "PUT", body: JSON.stringify({ name: document.getElementById("enforce-name").value, phoneNumber: document.getElementById("enforce-phone").value, address: document.getElementById("enforce-address").value }) });
                alert("Thành công!");
                checkProfileCompletion();
            } catch (e) { alert(e.message); }
        });

        initUser();
    });
</script>
</body>
</html>
